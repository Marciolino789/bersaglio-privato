<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bersaglio Privato</title><style>
:root{--paper:#faf8f2;--ink:#101010;--red:#a8231a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}main{max-width:920px;margin:auto;padding:20px 10px 48px}header{text-align:center;border-bottom:1px solid #222;padding-bottom:10px}h1{font:500 clamp(2rem,6vw,3.5rem) Georgia,serif;letter-spacing:.08em;margin:0}.sub{margin:.4rem;color:#555}.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px}.nav button,.ctrl button{font:700 .93rem Arial;background:#fff;border:1.5px solid #111;padding:.58rem .75rem;cursor:pointer}.nav button.active,.ctrl .primary{background:#111;color:#fff}.page{display:none}.page.active{display:block}.meta{text-align:center;margin:10px}.stage{width:min(97vw,760px);aspect-ratio:1;margin:auto}svg{width:100%;height:100%;overflow:visible}.sector{stroke:#111;stroke-width:2;cursor:pointer;fill:#fbfaf6}.sector.black{fill:#111;stroke:#fff}.sector.selected,.centre.selected{fill:var(--red);stroke:#111}.word{font:600 23px Arial;letter-spacing:.01em;pointer-events:none;fill:#111}.inverse,.selectedword{fill:#fff}.centre{fill:#fbfaf6;stroke:#111;stroke-width:2.5;cursor:pointer}.ctrl{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:15px}#path,#status,.card{max-width:750px;margin:10px auto;padding:12px;background:#fff;border:1px solid #cac6bc;line-height:1.45}.archive button{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;background:#fff;border:1px solid #222;font:600 1rem Arial;cursor:pointer}.done{color:#197238;font-weight:bold}.page h2{text-align:center;font:500 1.7rem Georgia}@media(max-width:520px){.word{font-size:16px}main{padding:14px 2px}}</style></head><body><main><header><h1>IL BERSAGLIO</h1><p class="sub">Collega tutte le parole una sola volta e raggiungi il centro.</p></header><nav class="nav"><button class="active" data-page="today">Gioca oggi</button><button data-page="archive">Archivio</button></nav><section class="page active" id="today"><div class="meta"><b id="title"></b> · <span id="date"></span> · <span id="difficulty"></span></div><div class="stage"><svg viewBox="0 0 800 800" aria-label="Bersaglio circolare"><g id="board"></g></svg></div><div class="ctrl"><button id="undo">Annulla ultimo passo</button><button id="clear">Cancella percorso</button><button class="primary" id="check">Verifica soluzione</button><button id="hint">Indizio</button></div><div id="path"></div><div id="status"></div></section><section class="page" id="archive"><div class="card"><h2>Archivio</h2><p>Scegli un Bersaglio da giocare.</p><div class="archive" id="archiveList"></div></div></section></main><script>
let data,current,path=[],hintIndex=0;const NS='http://www.w3.org/2000/svg',B=document.querySelector('#board');
const E=(n,a={})=>{let x=document.createElementNS(NS,n);for(const k in a)x.setAttribute(k,a[k]);return x};const P=(r,a)=>{let q=(a-90)*Math.PI/180;return[400+r*Math.cos(q),400+r*Math.sin(q)]};const W=(R,r,a,z)=>{let[A,B]=P(R,a),[C,D]=P(R,z),[e,f]=P(r,z),[g,h]=P(r,a);return`M${A} ${B}A${R} ${R} 0 0 1 ${C} ${D}L${e} ${f}A${r} ${r} 0 0 0 ${g} ${h}Z`};
function key(){return 'bersaglio-progress-'+current.id}function saved(){try{return JSON.parse(localStorage.getItem(key()))}catch(e){return null}}function save(completed=false){if(!current)return;let old=saved()||{};localStorage.setItem(key(),JSON.stringify({path:path,completed:completed||old.completed===true}))}function erase(){if(current)localStorage.removeItem(key())}function validPath(a){return Array.isArray(a)&&a.length&&a[0]===current.start&&a.every(x=>current.solution.includes(x))}
function rings(words){let w=[...words];return [[390,325,w.splice(0,7),0,0],[325,255,w.splice(0,5),1,5],[255,185,w.splice(0,4),0,25],[185,115,w.splice(0,4),1,0]]}
function msg(s){document.querySelector('#status').innerHTML=s}function draw(){B.innerHTML='';rings(current.words).forEach(([ro,ri,ws,black,off])=>ws.forEach((w,i)=>{let a=off+i*360/ws.length,z=off+(i+1)*360/ws.length,m=(a+z)/2,on=path.includes(w),q=E('path',{d:W(ro,ri,a,z),class:'sector '+(black?'black ':'')+(on?'selected':'')});q.onclick=()=>pick(w);B.append(q);let [x,y]=P((ro+ri)/2,m),angle=m;if(m>90&&m<270)angle+=180;let g=E('g',{transform:`translate(${x} ${y}) rotate(${angle})`}),t=E('text',{class:'word '+(black?'inverse ':'')+(on?'selectedword':'') ,'text-anchor':'middle','dominant-baseline':'middle'});t.textContent=w;g.append(t);B.append(g)}));let on=path.includes(current.end),c=E('circle',{cx:400,cy:400,r:115,class:'centre '+(on?'selected':'')});c.onclick=()=>pick(current.end);B.append(c);let t=E('text',{x:400,y:400,'text-anchor':'middle','dominant-baseline':'middle',class:'word '+(on?'selectedword':'')});t.textContent=current.end;B.append(t);document.querySelector('#path').innerHTML='<b>Percorso ('+path.length+'/'+current.solution.length+'):</b> '+path.join(' → ')}
function pick(w){let i=path.indexOf(w);if(i===0)return;if(i>0){path=path.slice(0,i);msg('Parola deselezionata.')}else{path.push(w);msg(w===current.end?'Parola finale selezionata.':'Parola aggiunta.')}save();draw()}
function load(p){current=p;hintIndex=0;let s=saved();path=validPath(s?.path)?s.path:[p.start];document.querySelector('#title').textContent=p.title;document.querySelector('#date').textContent=new Date(p.date+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'});document.querySelector('#difficulty').textContent=p.difficulty;msg(s?.completed?'<b class="done">✓ Bersaglio già completato su questo dispositivo.</b>':'Tocca le parole nell’ordine che ritieni corretto.');draw();show('today')}
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id))}document.querySelectorAll('.nav button').forEach(x=>x.onclick=()=>show(x.dataset.page));document.querySelector('#undo').onclick=()=>{if(path.length>1){path.pop();save();msg('Ultimo passo annullato.');draw()}};document.querySelector('#clear').onclick=()=>{path=[current.start];erase();msg('Percorso e salvataggio cancellati.');draw()};document.querySelector('#check').onclick=()=>{if(path.length<current.solution.length)return msg('Completa il percorso prima della verifica.');if(path.every((x,i)=>x===current.solution[i])){save(true);renderArchive();msg('<b class="done">✓ Complimenti! Bersaglio completato.</b>')}else msg('<b>Il percorso non è corretto.</b> Puoi correggerlo e verificare di nuovo.')};document.querySelector('#hint').onclick=()=>{let h=current.hints?.[hintIndex++];msg(h?'<b>Indizio:</b> '+h:'Non ci sono altri indizi.')};
function renderArchive(){let a=document.querySelector('#archiveList');a.innerHTML='';data.puzzles.sort((x,y)=>y.date.localeCompare(x.date)).forEach(x=>{let b=document.createElement('button'),s=localStorage.getItem('bersaglio-progress-'+x.id);let done=false;try{done=JSON.parse(s)?.completed===true}catch(e){}b.innerHTML=(done?'<span class="done">✓ </span>':'')+x.date+' — '+x.title+' ('+x.difficulty+')';b.onclick=()=>load(x);a.append(b)})}
fetch('puzzles.json').then(r=>r.json()).then(d=>{data=d;let today=new Date().toISOString().slice(0,10),p=d.puzzles.find(x=>x.date===today)||[...d.puzzles].sort((a,b)=>b.date.localeCompare(a.date))[0];renderArchive();load(p)}).catch(()=>msg('Impossibile caricare puzzles.json.'));
</script></body></html>
