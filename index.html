<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Il Bersaglio</title><style>body{margin:0;background:#faf8f2;font-family:Arial;color:#111}main{max-width:900px;margin:auto;padding:20px 10px}h1{text-align:center;font:500 42px Georgia;letter-spacing:.08em;margin:0}p{text-align:center;color:#555}.stage{width:min(97vw,760px);aspect-ratio:1;margin:auto}svg{width:100%;height:100%;overflow:visible}.sector{stroke:#111;stroke-width:2;cursor:pointer}.sector.black{fill:#111;stroke:#fff}.sector.white{fill:#fbfaf6}.sector.sel{fill:#a8231a;stroke:#111}.word{font:600 24px Arial;letter-spacing:.01em;pointer-events:none;fill:#111}.inverse,.selword{fill:#fff}.centre{fill:#fbfaf6;stroke:#111;stroke-width:2.5;cursor:pointer}.centre.sel{fill:#a8231a}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:15px}button{font-weight:bold;padding:10px;border:1px solid #111;background:#fff}.primary{background:#111;color:#fff}#path,#status{max-width:740px;margin:10px auto;padding:12px;background:white;border:1px solid #ccc}</style><main><h1>IL BERSAGLIO</h1><p>Le basi delle parole seguono la direzione dell’anello e del loro settore.</p><div class="stage"><svg viewBox="0 0 800 800"><defs><marker id="tip" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L12 6L0 12z"/></marker></defs><g id="board"></g><g><path d="M61 134Q107 82 170 75" fill="none" stroke="#111" stroke-width="5" marker-end="url(#tip)"/><text x="38" y="105" font-family="Arial" font-weight="bold">INIZIO</text></g></svg></div><div class="controls"><button id="undo">Annulla ultimo passo</button><button id="clear">Cancella percorso</button><button class="primary" id="check">Verifica soluzione</button></div><div id="path"></div><div id="status">Tocca una parola per aggiungerla; toccala di nuovo per deselezionarla.</div></main><script>const rings=[[390, 310, ["Omero", "Troia", "Vista", "Assedio", "Cocchio", "Odissea", "Cavallo", "Occhio"], false, 0], [310, 225, ["Bottiglie", "Arca", "Visita", "Vino", "Biglietto", "Noè", "Barca"], true, 12], [225, 140, ["Romolo", "Lesina", "Remo", "Sabine", "Saline"], false, 36]],sol=["Omero", "Odissea", "Assedio", "Troia", "Cavallo", "Cocchio", "Occhio", "Vista", "Visita", "Biglietto", "Bottiglie", "Vino", "Noè", "Arca", "Barca", "Remo", "Romolo", "Sabine", "Saline", "Lesina", "Fori"];let path=['Omero'];const NS='http://www.w3.org/2000/svg',b=document.querySelector('#board');const E=(n,a={})=>{let x=document.createElementNS(NS,n);for(let k in a)x.setAttribute(k,a[k]);return x};const P=(r,a)=>{let q=(a-90)*Math.PI/180;return[400+r*Math.cos(q),400+r*Math.sin(q)]};function wedge(R,r,a,z){let[A,B]=P(R,a),[C,D]=P(R,z),[e,f]=P(r,z),[g,h]=P(r,a);return`M${A} ${B}A${R} ${R} 0 0 1 ${C} ${D}L${e} ${f}A${r} ${r} 0 0 0 ${g} ${h}Z`}function pick(w){let i=path.indexOf(w);if(i===0)return;if(i>0)path=path.slice(0,i);else path.push(w);draw()}function draw(){b.innerHTML='';rings.forEach(([R,r,ws,black,off])=>ws.forEach((w,i)=>{let a=off+i*360/ws.length,z=off+(i+1)*360/ws.length,m=(a+z)/2,on=path.includes(w),q=E('path',{d:wedge(R,r,a,z),class:'sector '+(black?'black':'white')+(on?' sel':'')});q.onclick=()=>pick(w);b.append(q);let [x,y]=P((R+r)/2,m);/* Baseline tangent to ring / follows the sector, as requested */let angle=m;if(m>90&&m<270)angle+=180;let g=E('g',{transform:`translate(${x} ${y}) rotate(${angle})`}),t=E('text',{class:'word '+(black?'inverse ':'')+(on?'selword':''),'text-anchor':'middle','dominant-baseline':'middle'});t.textContent=w;g.append(t);b.append(g)}));let on=path.includes('Fori'),c=E('circle',{cx:400,cy:400,r:140,class:'centre '+(on?'sel':'')});c.onclick=()=>pick('Fori');b.append(c);let t=E('text',{x:400,y:400,'text-anchor':'middle','dominant-baseline':'middle',class:'word '+(on?'selword':'')});t.textContent='FORI';b.append(t);document.querySelector('#path').innerHTML='<b>Percorso ('+path.length+'/21):</b> '+path.join(' → ')}document.querySelector('#undo').onclick=()=>{if(path.length>1){path.pop();draw()}};document.querySelector('#clear').onclick=()=>{path=['Omero'];draw()};document.querySelector('#check').onclick=()=>{document.querySelector('#status').innerHTML=path.length<21?'Completa il percorso prima della verifica.':path.every((x,i)=>x===sol[i])?'<b>Complimenti!</b> Bersaglio completato.':'Il percorso non è corretto.'};draw();</script>
